name: Vérification des photographies libres
on:
  push:
    paths:
      - 'assets/photo_candidates.json'
      - 'scripts/prepare_public_data.py'
      - 'scripts/download_photo_pack.py'
      - '.github/workflows/photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.download_photo_pack photos-libres.zip
      - uses: actions/upload-artifact@v4
        with:
          name: photos-libres
          path: photos-libres.zip
          if-no-files-found: error
