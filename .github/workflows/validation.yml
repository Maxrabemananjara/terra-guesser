name: Validation Terra Guesser
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py modules tests
      - run: python -m unittest tests.test_scoring tests.test_release tests.test_smoke tests.test_class_metadata -v
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_responsive_browser -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: browser-artifacts/
