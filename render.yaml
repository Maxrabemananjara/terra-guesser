# Configuration proposée, à approuver dans Render avant toute facturation.
services:
  - type: web
    name: terra-guesser
    runtime: docker
    plan: standard
    region: frankfurt
    autoDeployTrigger: off
    healthCheckPath: /_stcore/health
    numInstances: 1
    disk:
      name: terra-results
      mountPath: /var/terra
      sizeGB: 1
    envVars:
      - key: TERRA_PUBLIC
        value: "1"
      - key: TERRA_ALLOW_DEMO
        value: "0"
      - key: TERRA_DATA_ZIP
        value: /app/terra-public.zip
      - key: TERRA_PARTIES_DB
        value: /var/terra/parties.sqlite
      - key: TERRA_TEACHER_SECRET
        generateValue: true
